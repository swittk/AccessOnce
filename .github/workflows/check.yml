name: check
on:
  push:
  pull_request:
jobs:
  assurance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install pinned TLA+ tools
        run: |
          mkdir -p .artifacts
          curl --fail --location --retry 3 --output .artifacts/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  .artifacts/tla2tools.jar' | sha256sum --check -
      - run: pnpm assurance
